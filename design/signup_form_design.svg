<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><title>StayHealthy editable interface design</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#faf9f3" stroke="none"/><rect x="0" y="0" width="1440" height="96" rx="0" fill="#faf9f3" stroke="none"/><rect x="80" y="27" width="42" height="42" rx="12" fill="#235d4e" stroke="none"/><text x="91" y="56" font-family="Arial" font-size="29" font-weight="600" fill="#fffefa">+</text><text x="134" y="57" font-family="Arial" font-size="27" font-weight="700" fill="#235d4e">StayHealthy.</text><text x="770" y="55" font-family="Arial" font-size="15" font-weight="600" fill="#203e35">Home</text><text x="860" y="55" font-family="Arial" font-size="15" font-weight="600" fill="#203e35">Appointments</text><text x="1015" y="55" font-family="Arial" font-size="15" font-weight="600" fill="#203e35">Reviews</text><text x="1130" y="55" font-family="Arial" font-size="15" font-weight="600" fill="#203e35">Login</text><rect x="1230" y="23" width="130" height="50" rx="7" fill="#235d4e" stroke="none"/><text x="1250" y="54" font-family="Arial" font-size="15" font-weight="600" fill="#fffefa">Sign Up ↗</text><path d="M0 96H1440" stroke="#dfe4d9"/><rect x="80" y="133" width="530" height="867" rx="18" fill="#eaf0e1" stroke="none"/><text x="115" y="180" font-family="Arial" font-size="14" font-weight="400" fill="#5e7256">← Back to home</text><text x="115" y="273" font-family="Georgia" font-size="48" font-weight="400" fill="#203e35">Care that meets</text><text x="115" y="332" font-family="Georgia" font-size="48" font-weight="400" fill="#65815c">you where you are.</text><text x="115" y="391" font-family="Arial" font-size="16" font-weight="400" fill="#62775b">A thoughtful space to connect with doctors</text><text x="115" y="418" font-family="Arial" font-size="16" font-weight="400" fill="#62775b">and keep your wellbeing within reach.</text><circle cx="345" cy="650" r="150" fill="#d7e5cf"/><rect x="218" y="665" width="253" height="160" rx="70" fill="#fffefa" stroke="none"/><circle cx="345" cy="586" r="61" fill="#d6a582"/><path d="M283 587c-30-110 154-105 120 4-15-49-70-9-104-65Z" fill="#263f38"/><text x="115" y="950" font-family="Arial" font-size="15" font-weight="400" fill="#4f6846">✓ Easy appointment booking</text><text x="115" y="980" font-family="Arial" font-size="15" font-weight="400" fill="#4f6846">✓ Your care in one place</text><text x="710" y="175" font-family="Arial" font-size="12" font-weight="700" fill="#657d59">LET’S GET YOU STARTED</text><text x="710" y="230" font-family="Georgia" font-size="42" font-weight="400" fill="#203e35">Create your account</text><text x="710" y="268" font-family="Arial" font-size="15" font-weight="400" fill="#66756c">Already part of StayHealthy? Log in</text><text x="710" y="315" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Role</text><rect x="710" y="328" width="610" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="725" y="360" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">Patient                                      ⌄</text><text x="710" y="407" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Name</text><rect x="710" y="420" width="610" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="725" y="452" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">Your full name</text><text x="710" y="499" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Email</text><rect x="710" y="512" width="295" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="725" y="544" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">you@example.com</text><text x="1025" y="499" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Phone Number</text><rect x="1025" y="512" width="295" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="1040" y="544" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">+252 61 000 0000</text><text x="710" y="591" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Password</text><rect x="710" y="604" width="610" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="725" y="636" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">At least 10 characters</text><text x="710" y="675" font-family="Arial" font-size="12" font-weight="400" fill="#66756c">Use a unique password of 10–128 characters.</text><text x="710" y="716" font-family="Arial" font-size="14" font-weight="600" fill="#203e35">Confirm Password</text><rect x="710" y="729" width="610" height="50" rx="8" fill="#fffefa" stroke="#d5ddcf"/><text x="725" y="761" font-family="Arial" font-size="14" font-weight="400" fill="#82907b">Re-enter your password</text><rect x="710" y="807" width="17" height="17" rx="8" fill="#fffefa" stroke="#9bad90"/><text x="738" y="821" font-family="Arial" font-size="13" font-weight="400" fill="#62705b">I understand this is a learning demo and will use fictional details.</text><rect x="710" y="859" width="610" height="50" rx="7" fill="#235d4e" stroke="none"/><text x="730" y="890" font-family="Arial" font-size="15" font-weight="600" fill="#fffefa">Create account                                                   →</text><text x="855" y="947" font-family="Arial" font-size="13" font-weight="400" fill="#66756c">Your next chapter of care starts here.</text></svg>